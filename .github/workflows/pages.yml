name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fest-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: fest-app/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Configure GitHub Pages base path
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.expo = data.expo || {};
          data.expo.experiments = data.expo.experiments || {};
          data.expo.experiments.baseUrl = '/Plans';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - run: npx expo export --platform web
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fest-app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
